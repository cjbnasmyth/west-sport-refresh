name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild daily so the Insights section picks up new LinkedIn posts (see scripts/fetch-linkedin-posts.mjs).
  schedule:
    - cron: "0 6 * * *"
  # Allow a manual rebuild from the Actions tab.
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so the deploy action can create/force-update branches
          fetch-depth: 0
          # Ensure the token is available for pushing (default true, explicit here)
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set these under Settings → Secrets and variables → Actions → Variables
          VITE_LINKEDIN_PROFILE_URL: ${{ vars.VITE_LINKEDIN_PROFILE_URL }}
          # Leave VITE_LINKEDIN_POST_URNS unset to show the latest posts automatically; set it to pin specific posts.
          VITE_LINKEDIN_POST_URNS: ${{ vars.VITE_LINKEDIN_POST_URNS }}
          VITE_LINKEDIN_POST_COUNT: ${{ vars.VITE_LINKEDIN_POST_COUNT }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./dist
          publish_branch: gh-pages
          github_token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
          # Allow the action to create the branch even if no files changed
          allow_empty_commit: true
          # Use an explicit commit message to aid debugging
          commit_message: "Deploy to GitHub Pages: ${{ github.sha }}"
