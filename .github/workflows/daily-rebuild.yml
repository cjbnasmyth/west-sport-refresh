name: Daily rebuild

# The site is built and hosted by Cloudflare Pages, which already rebuilds on every push to main.
# This workflow only adds a daily rebuild, so scheduled (future-dated) articles go live on their
# date and the Insights section picks up new LinkedIn posts.
#
# Setup: Cloudflare dashboard → Workers & Pages → this project → Settings → Builds → Deploy hooks →
# add a hook for the main branch, then save its URL as the repository secret CLOUDFLARE_DEPLOY_HOOK
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).

on:
  schedule:
    - cron: "0 6 * * *"
  # Allow a manual rebuild from the Actions tab.
  workflow_dispatch:

jobs:
  trigger-cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK secret is not set (see the comment at the top of this workflow)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
