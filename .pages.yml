# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Every editable file lives in src/content; the site reads them through src/content/index.ts.
# Edit this file in place (or via the Pages CMS settings page) to change the editor forms.

media:
  input: src/content/images
  output: /images
  categories: [image]

content:
  - name: articles
    label: Articles
    description: Turn Draft off to publish. A future date schedules the article for that day.
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    # The part after the date becomes the article's address: /articles/<title>/
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
      - name: excerpt
        label: Summary
        type: text
        description: One or two sentences, shown on article cards, under the headline and in link previews.
      - name: cover
        label: Cover image
        type: image
        options:
          path: src/content/images/articles
      - name: coverAlt
        label: Cover image description (for screen readers)
        type: string
      - name: author
        label: Author
        type: string
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          path: src/content/images/articles

  - name: articles-page
    label: Articles page text
    type: file
    path: src/content/articles.json
    format: json
    fields:
      - name: eyebrow
        label: Homepage section eyebrow
        type: string
      - name: title
        label: Homepage section heading
        type: string
      - name: intro
        label: Homepage section intro
        type: text
      - name: viewAllLabel
        label: View all button label
        type: string
      - name: readMoreLabel
        label: Card link label
        type: string
      - name: readingTimeLabel
        label: Reading time label (after the number)
        type: string
      - name: index
        label: All articles page
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: empty, label: Message when there are no articles (here and on the homepage), type: string }
      - name: article
        label: Article page
        type: object
        fields:
          - { name: backLabel, label: Back link label, type: string }
          - { name: previousLabel, label: Previous article label, type: string }
          - { name: nextLabel, label: Next article label, type: string }
      - name: notFound
        label: Page not found
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: body, label: Text, type: text }
          - { name: homeLabel, label: Button label, type: string }

  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: Company name
        type: string
        required: true
      - name: url
        label: Website address
        type: string
        readonly: true
        description: Used for search engines and link previews.
      - name: title
        label: Browser tab title (homepage)
        type: string
        required: true
      - name: description
        label: Search result description (homepage)
        type: text
      - name: email
        label: Contact email
        type: string
        required: true
      - name: social
        label: Social links
        type: object
        fields:
          - name: linkedin
            label: LinkedIn URL
            type: string
            description: Can be overridden at build time by VITE_LINKEDIN_PROFILE_URL.
          - name: threads
            label: Threads URL
            type: string
            description: e.g. https://www.threads.com/@yourhandle. Leave empty to hide the Threads icon.
      - name: logos
        label: Logos
        type: object
        description: Logo artwork used in the header, menu and footer.
        fields:
          - name: mark
            label: Mark
            type: image
          - name: wordmarkNavy
            label: Wordmark (navy)
            type: image
          - name: wordmarkWhite
            label: Wordmark (white)
            type: image
          - name: wordNavy
            label: Word (navy)
            type: image
          - name: wordWhite
            label: Word (white)
            type: image
      - name: nav
        label: Navigation links
        type: object
        description: Each link points at a section of the homepage.
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: name
            label: Label
            type: string
            required: true
          - name: href
            label: Section
            type: select
            options:
              values: ["#about", "#services", "#bio", "#articles", "#blog", "#contact"]
      - name: contactLink
        label: Contact link
        type: object
        fields:
          - name: name
            label: Label
            type: string
          - name: href
            type: string
            hidden: true
      - name: header
        label: Header
        type: object
        fields:
          - name: skipLink
            label: Skip link text (keyboard users)
            type: string
          - name: cta
            label: Button label
            type: string
          - name: compactName
            label: Name shown next to the logo once you scroll
            type: string
      - name: footer
        label: Footer
        type: object
        fields:
          - name: backToTop
            label: Back to top label
            type: string
          - name: companyDetails
            label: Company details (centred at the bottom)
            type: string

  - name: hero
    label: Hero
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: headline
        label: Headline
        type: string
        required: true
      - name: image
        label: Image
        type: object
        fields:
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Image description (for screen readers)
            type: string
          - name: width
            label: Width (px)
            type: number
            description: The image's real pixel width; prevents layout shift while it loads.
          - name: height
            label: Height (px)
            type: number

  - name: about
    label: About
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: titleAccent
        label: Heading (highlighted second line)
        type: string
      - name: paragraphs
        label: Paragraphs
        type: text
        list: true
      - name: stats
        label: Stats
        type: object
        list:
          max: 3
          collapsible:
            summary: "{label}"
        fields:
          - name: icon
            label: Icon
            type: select
            hidden: true
            options:
              values: [award, users, zap, target, handshake, trending-up, megaphone]
          - name: value
            label: Number
            type: number
          - name: suffix
            label: Suffix (e.g. +, M+)
            type: string
          - name: label
            label: Label
            type: string
      - name: image
        label: Image
        type: object
        fields:
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Image description (for screen readers)
            type: string

  - name: services
    label: Services
    type: file
    path: src/content/services.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Intro
        type: text
      - name: backgroundImage
        label: Background image
        type: image
      - name: items
        label: Services
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - name: icon
            label: Icon
            type: select
            hidden: true
            options:
              values: [award, users, zap, target, handshake, trending-up, megaphone]
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text

  - name: bio
    label: Bio
    type: file
    path: src/content/bio.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Subtitle
        type: text
      - name: paragraphs
        label: Paragraphs
        type: text
        list: true
      - name: image
        label: Photo
        type: object
        fields:
          - name: src
            label: Photo
            type: image
            required: true
            description: Shown as a square on the left. Upload a square photo of at least 800×800 pixels; other shapes are cropped.
          - name: alt
            label: Photo description (for screen readers)
            type: string

  - name: insights
    label: Insights
    type: file
    path: src/content/insights.json
    format: json
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Intro
        type: text
      - name: followLabel
        label: Follow button label
        type: string
      - name: readMoreLabel
        label: Card link label
        type: string
      - name: typeLabels
        label: Post type badges
        type: object
        fields:
          - name: article
            label: Article
            type: string
          - name: video
            label: Video
            type: string
          - name: post
            label: Post
            type: string

  - name: contact
    label: Contact
    type: file
    path: src/content/contact.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Intro
        type: text
      - name: form
        label: Form
        type: object
        fields:
          - name: name
            label: Name field
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: placeholder, label: Placeholder, type: string }
          - name: email
            label: Email field
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: placeholder, label: Placeholder, type: string }
          - name: message
            label: Message field
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: placeholder, label: Placeholder, type: string }
          - name: submit
            label: Submit button label
            type: string
      - name: details
        label: Contact details
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: body
            label: Text
            type: text
          - name: emailLabel
            label: Email label
            type: string
