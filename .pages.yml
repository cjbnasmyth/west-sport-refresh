# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Every editable file lives in src/content; the site reads them through src/content/index.ts.
# Edit this file in place (or via the Pages CMS settings page) to change the editor forms.

media:
  input: src/content/images
  output: /images
  categories: [image]

content:
  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: Company name
        type: string
        required: true
      - name: email
        label: Contact email
        type: string
        required: true
      - name: social
        label: Social links
        type: object
        fields:
          - name: linkedin
            label: LinkedIn URL
            type: string
            description: Can be overridden at build time by VITE_LINKEDIN_PROFILE_URL.
          - name: x
            label: X URL
            type: string
      - name: logos
        label: Logos
        type: object
        description: Logo artwork used in the header, menu and footer.
        fields:
          - name: mark
            label: Mark
            type: image
          - name: wordmarkNavy
            label: Wordmark (navy)
            type: image
          - name: wordmarkWhite
            label: Wordmark (white)
            type: image
          - name: wordNavy
            label: Word (navy)
            type: image
          - name: wordWhite
            label: Word (white)
            type: image
      - name: nav
        label: Navigation links
        type: object
        description: Each link must point at a section on the page (#about, #services or #blog).
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: name
            label: Label
            type: string
            required: true
          - name: href
            label: Section
            type: select
            options:
              values: ["#about", "#services", "#blog", "#contact"]
      - name: contactLink
        label: Contact link
        type: object
        fields:
          - name: name
            label: Label
            type: string
          - name: href
            type: string
            hidden: true
      - name: header
        label: Header
        type: object
        fields:
          - name: skipLink
            label: Skip link text (keyboard users)
            type: string
          - name: cta
            label: Button label
            type: string
      - name: footer
        label: Footer
        type: object
        fields:
          - name: backToTop
            label: Back to top label
            type: string

  - name: hero
    label: Hero
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: headline
        label: Headline
        type: string
        required: true
      - name: image
        label: Image
        type: object
        fields:
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Image description (for screen readers)
            type: string
          - name: width
            label: Width (px)
            type: number
            description: The image's real pixel width; prevents layout shift while it loads.
          - name: height
            label: Height (px)
            type: number

  - name: about
    label: About
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: titleAccent
        label: Heading (highlighted second line)
        type: string
      - name: paragraphs
        label: Paragraphs
        type: text
        list: true
      - name: stats
        label: Stats
        type: object
        list:
          max: 3
          collapsible:
            summary: "{label}"
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: [award, users, zap, target, handshake, trending-up, megaphone]
          - name: value
            label: Number
            type: number
          - name: suffix
            label: Suffix (e.g. +, M+)
            type: string
          - name: label
            label: Label
            type: string
      - name: image
        label: Image
        type: object
        fields:
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Image description (for screen readers)
            type: string

  - name: services
    label: Services
    type: file
    path: src/content/services.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Intro
        type: text
      - name: backgroundImage
        label: Background image
        type: image
      - name: items
        label: Services
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: [award, users, zap, target, handshake, trending-up, megaphone]
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text

  - name: insights
    label: Insights
    type: file
    path: src/content/insights.json
    format: json
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Intro
        type: text
      - name: followLabel
        label: Follow button label
        type: string
      - name: readMoreLabel
        label: Card link label
        type: string
      - name: typeLabels
        label: Post type badges
        type: object
        fields:
          - name: article
            label: Article
            type: string
          - name: video
            label: Video
            type: string
          - name: post
            label: Post
            type: string

  - name: contact
    label: Contact
    type: file
    path: src/content/contact.json
    format: json
    fields:
      - name: title
        label: Heading
        type: string
      - name: intro
        label: Intro
        type: text
      - name: form
        label: Form
        type: object
        fields:
          - name: name
            label: Name field
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: placeholder, label: Placeholder, type: string }
          - name: email
            label: Email field
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: placeholder, label: Placeholder, type: string }
          - name: message
            label: Message field
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: placeholder, label: Placeholder, type: string }
          - name: submit
            label: Submit button label
            type: string
      - name: details
        label: Contact details
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: body
            label: Text
            type: text
          - name: emailLabel
            label: Email label
            type: string
